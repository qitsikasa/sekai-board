<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEKAI Board · Inicio</title>
<script>
(()=>{const t=localStorage.getItem('sekai-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-bs-theme',t)})()
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="css/sekai.css" rel="stylesheet">
</head>
<body data-page="inicio">

<nav class="navbar navbar-expand-lg navbar-sekai fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-sekai">SEKAI</span> Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" data-nav="inicio" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="unidades" href="unidades.html">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="personajes" href="personajes.html">Personajes</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="eventos" href="eventos.html">Eventos</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="booru" href="booru.html">Booru</a></li>
      </ul>
      <button id="themeToggle" class="btn btn-soft ms-lg-2" aria-label="Cambiar tema">☀️</button>
    </div>
  </div>
</nav>

<main class="container pb-5 pt-3">
  <!-- Hero: evento en curso -->
  <section class="hero mb-4" style="min-height: 300px">
    <img id="heroImg" alt="Evento en curso">
    <span class="badge-event">EVENTO EN CURSO</span>
    <div class="hero-body">
      <h1 class="h3 fw-bold mb-1" id="heroTitle">…</h1>
      <p class="mb-2 opacity-75 small" id="heroSub"></p>
      <div class="d-flex gap-2">
        <a href="eventos.html" class="btn btn-accent btn-sm">Ver eventos</a>
        <a href="booru.html" class="btn btn-soft btn-sm">Booru</a>
      </div>
    </div>
  </section>

  <div class="row g-4">
    <div class="col-lg-7">
      <h2 class="section-title mb-3">Noticias</h2>
      <div id="newsList" class="d-grid gap-2"></div>
    </div>
    <div class="col-lg-5">
      <h2 class="section-title mb-3">Unidades</h2>
      <div id="unitStrip" class="d-grid gap-2"></div>
    </div>
  </div>

  <section class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="section-title mb-0">Booru · recientes</h2>
      <a href="booru.html" class="text-accent fw-semibold text-decoration-none">Ver todo →</a>
    </div>
    <div id="homeBooru" class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-2"></div>
  </section>

  <section class="mt-4">
    <h2 class="section-title mb-3">Canciones destacadas</h2>
    <div id="songStrip" class="row row-cols-2 row-cols-md-4 row-cols-lg-8 g-3"></div>
  </section>
</main>

<footer class="py-4 mt-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>SEKAI Board · Práctica 6 — Programación Web I</span>
    <span>Assets: Project Sekai (fan project)</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sekai.js"></script>
<script>
function renderPage(D) {
  const ev = D.events[0];
  document.getElementById("heroImg").src = ev.banner;
  document.getElementById("heroTitle").textContent = ev.name;
  document.getElementById("heroSub").textContent =
    (ev.start ? "Del " + fmtDate(ev.start) : "") + (ev.end ? " al " + fmtDate(ev.end) : "");

  document.getElementById("newsList").innerHTML = D.events.slice(0, 3).map(e => `
    <a href="eventos.html" class="card rounded-xxl text-decoration-none text-body">
      <div class="list-news-item">
        <span class="bar"></span>
        <div class="flex-grow-1">
          <div class="fw-bold">${esc(e.name)}</div>
          <small class="text-muted-soft">${fmtDate(e.start)}</small>
        </div>
        <i class="bi bi-chevron-right text-muted-soft"></i>
      </div>
    </a>`).join("");

  document.getElementById("unitStrip").innerHTML = D.units.map(u => `
    <a href="unidades.html" class="card rounded-xxl text-decoration-none text-body">
      <div class="d-flex align-items-center gap-3 p-3">
        <span class="attr-dot" style="background:${u.color};width:10px;height:10px"></span>
        <div class="flex-grow-1">
          <div class="fw-bold">${esc(u.name)}</div>
          <small class="text-muted-soft">${esc(u.tag)}</small>
        </div>
        <i class="bi bi-chevron-right text-muted-soft"></i>
      </div>
    </a>`).join("");

  document.getElementById("homeBooru").innerHTML = D.booru.slice(0, 6).map(it => `
    <div class="col">
      <div class="booru-item" onclick="location.href='booru.html'">
        <img class="img-card" src="${it.src}" alt="">
        <span class="badge-favs">❤ ${it.favs}</span>
      </div>
    </div>`).join("");

  document.getElementById("songStrip").innerHTML = D.songs.slice(0, 8).map(s => `
    <div class="col jacket-item text-center">
      <img src="${s.jacket}" alt="${esc(s.title)}">
      <small class="d-block mt-2 text-muted-soft text-truncate">${esc(s.title)}</small>
    </div>`).join("");
}
</script>
</body>
</html>
