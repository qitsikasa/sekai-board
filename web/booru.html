<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEKAI Board · Booru</title>
<script>
(()=>{const t=localStorage.getItem('sekai-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-bs-theme',t)})()
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="css/sekai.css" rel="stylesheet">
</head>
<body data-page="booru">

<nav class="navbar navbar-expand-lg navbar-sekai fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-sekai">SEKAI</span> Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" data-nav="inicio" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="unidades" href="unidades.html">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="personajes" href="personajes.html">Personajes</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="eventos" href="eventos.html">Eventos</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="booru" href="booru.html">Booru</a></li>
      </ul>
      <button id="themeToggle" class="btn btn-soft ms-lg-2" aria-label="Cambiar tema">☀️</button>
    </div>
  </div>
</nav>

<main class="container pb-5 pt-3">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
    <div>
      <h1 class="fw-bold mb-1">Sekai Booru</h1>
      <p class="text-muted-soft mb-0"><span id="imgCount">0</span> imgs · galería de la comunidad</p>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="input-group">
        <span class="input-group-text bg-surface border-end-0"><i class="bi bi-search text-muted-soft"></i></span>
        <input id="searchInput" type="search" class="form-control bg-surface border-start-0" placeholder="Buscar tags: miku, live, card, event…">
      </div>
    </div>
  </div>

  <div id="tagFilters" class="d-flex flex-wrap gap-2 mb-4"></div>

  <div id="booruGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xxl-6 g-3"></div>
  <p id="emptyMsg" class="text-muted-soft text-center py-5 d-none">Nada por aquí… prueba otro tag 🎀</p>
</main>

<footer class="py-4 mt-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>SEKAI Board · Práctica 6 — Programación Web I</span>
    <span>Assets: Project Sekai (fan project)</span>
  </div>
</footer>

<!-- Visor de imagen -->
<div class="modal fade" id="viewer" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-header border-0 pb-1">
        <div class="text-white">
          <div class="fw-bold" id="vTitle">Imagen</div>
          <small class="opacity-75" id="vSub"></small>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <img id="vImg" class="w-100 rounded-3" alt="Vista ampliada">
      </div>
      <div class="modal-footer border-0">
        <button id="vFav" class="btn btn-accent">❤ Favorito</button>
        <a id="vOpen" href="#" target="_blank" rel="noopener" class="btn btn-soft">Abrir original</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sekai.js"></script>
<script>
const FAV_KEY = "sekai-favs";
const getFavs = () => new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"));
const saveFavs = s => localStorage.setItem(FAV_KEY, JSON.stringify([...s]));
let activeTag = null;
let query = new URLSearchParams(location.search).get("q") || "";

function renderPage(D) {
  const chips = ["card", "live", "event", "cool", "cute", "happy", "pure", "miku", "emu"];
  document.getElementById("tagFilters").innerHTML = chips.map(t =>
    `<button class="chip-btn ${t === activeTag ? "active" : ""}" data-tag="${t}">${t}</button>`).join("");
  document.querySelectorAll("#tagFilters .chip-btn").forEach(b => b.onclick = () => {
    activeTag = activeTag === b.dataset.tag ? null : b.dataset.tag;
    renderPage(D);
  });

  const favs = getFavs();
  const q = query.trim().toLowerCase();
  const items = D.booru.filter(it => {
    const okTag = !activeTag || it.tags.some(t => t === activeTag);
    const okQ = !q || it.tags.some(t => String(t).includes(q)) || String(it.type).includes(q);
    return okTag && okQ;
  });
  document.getElementById("imgCount").textContent = items.length;
  document.getElementById("emptyMsg").classList.toggle("d-none", items.length > 0);
  document.getElementById("booruGrid").innerHTML = items.map((it, i) => `
    <div class="col">
      <div class="booru-item" data-i="${D.booru.indexOf(it)}" data-bs-toggle="modal" data-bs-target="#viewer">
        <img class="img-card" src="${it.src}" alt="${it.tags.join(", ")}">
        <span class="badge-favs">❤ ${it.favs + (favs.has(it.src) ? 1 : 0)}</span>
      </div>
    </div>`).join("");

  document.querySelectorAll("#booruGrid .booru-item").forEach(el =>
    el.addEventListener("click", () => openViewer(D, +el.dataset.i, favs)));
}

function openViewer(D, idx, favs) {
  const it = D.booru[idx];
  document.getElementById("vImg").src = it.src;
  document.getElementById("vTitle").textContent = it.type === "card" ? `Carta · ${it.char}` : it.type === "live" ? "Live · jacket" : "Evento · banner";
  document.getElementById("vSub").textContent = it.tags.join(" · ") + ` · ${it.w}×${it.h}`;
  const btn = document.getElementById("vFav");
  const setLabel = on => btn.textContent = on ? "❤ En favoritos" : "❤ Favorito";
  setLabel(favs.has(it.src));
  btn.onclick = () => {
    const f = getFavs();
    f.has(it.src) ? f.delete(it.src) : f.add(it.src);
    saveFavs(f); setLabel(f.has(it.src));
    document.querySelectorAll(`.booru-item[data-i="${idx}"] .badge-favs`).forEach(b =>
      b.textContent = "❤ " + (it.favs + (f.has(it.src) ? 1 : 0)));
  };
  document.getElementById("vOpen").href = it.src;
}

document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("searchInput");
  input.value = query;
  input.addEventListener("input", () => { query = input.value; renderPage(window.SEKAI); });
});
</script>
</body>
</html>
