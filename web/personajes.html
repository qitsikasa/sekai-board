<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEKAI Board · Personajes</title>
<script>
(()=>{const t=localStorage.getItem('sekai-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-bs-theme',t)})()
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="css/sekai.css" rel="stylesheet">
</head>
<body data-page="personajes">

<nav class="navbar navbar-expand-lg navbar-sekai fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-sekai">SEKAI</span> Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" data-nav="inicio" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="unidades" href="unidades.html">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="personajes" href="personajes.html">Personajes</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="eventos" href="eventos.html">Eventos</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="booru" href="booru.html">Booru</a></li>
      </ul>
      <button id="themeToggle" class="btn btn-soft ms-lg-2" aria-label="Cambiar tema">☀️</button>
    </div>
  </div>
</nav>

<main class="container pb-5 pt-3">
  <h1 class="fw-bold mb-1">Personajes</h1>
  <p class="text-muted-soft mb-3">Destacados de cada unidad · 26 en total</p>
  <div id="charFilters" class="d-flex flex-wrap gap-2 mb-4"></div>
  <div id="charGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xxl-5 g-3"></div>
</main>

<footer class="py-4 mt-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>SEKAI Board · Práctica 6 — Programación Web I</span>
    <span>Assets: Project Sekai (fan project)</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sekai.js"></script>
<script>
let activeUnit = null;
function renderPage(D) {
  const filters = [{ id: null, name: "Todos", color: "var(--sekai-accent)" }].concat(D.units);
  document.getElementById("charFilters").innerHTML = filters.map(f => `
    <button class="chip-btn ${f.id === activeUnit ? "active" : ""}" data-unit="${f.id ?? ""}">
      ${f.id ? `<span class="attr-dot me-1" style="background:${f.color}"></span>` : ""}${esc(f.name)}
    </button>`).join("");
  document.querySelectorAll("#charFilters .chip-btn").forEach(b =>
    b.addEventListener("click", () => {
      activeUnit = b.dataset.unit || null;
      if (location.hash) history.replaceState(null, "", location.pathname);
      renderPage(D);
    }));

  const list = activeUnit ? D.characters.filter(c => c.unit === activeUnit) : D.characters;
  document.getElementById("charGrid").innerHTML = list.map(c => `
    <div class="col" id="${c.id}">
      <div class="card char-card rounded-xxl h-100">
        <div class="portrait-wrap">
          <img src="${c.portrait}" alt="${esc(c.name)}">
        </div>
        <div class="card-body py-3 px-3">
          <div class="fw-bold text-truncate">${esc(c.name)}</div>
          <div class="d-flex align-items-center gap-2 mt-1">
            <span class="attr-dot" style="background:${unitColor(c.unit)}"></span>
            <small class="text-muted-soft text-truncate">${esc(unitName(c.unit))}</small>
          </div>
          <a class="btn btn-soft btn-sm w-100 mt-2" href="booru.html?q=${encodeURIComponent(c.first.toLowerCase())}">Ver en booru</a>
        </div>
      </div>
    </div>`).join("");

  const h = location.hash.replace("#", "");
  if (h) {
    const el = document.getElementById(h);
    if (el) { activeUnit = null; renderPage(D); setTimeout(() => document.getElementById(h)?.scrollIntoView({ behavior: "smooth", block: "center" }), 50); }
  }
}
</script>
</body>
</html>
