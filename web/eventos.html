<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEKAI Board · Eventos</title>
<script>
(()=>{const t=localStorage.getItem('sekai-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-bs-theme',t)})()
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="css/sekai.css" rel="stylesheet">
</head>
<body data-page="eventos">

<nav class="navbar navbar-expand-lg navbar-sekai fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-sekai">SEKAI</span> Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" data-nav="inicio" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="unidades" href="unidades.html">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="personajes" href="personajes.html">Personajes</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="eventos" href="eventos.html">Eventos</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="booru" href="booru.html">Booru</a></li>
      </ul>
      <button id="themeToggle" class="btn btn-soft ms-lg-2" aria-label="Cambiar tema">☀️</button>
    </div>
  </div>
</nav>

<main class="container pb-5 pt-3">
  <h1 class="fw-bold mb-1">Eventos</h1>
  <p class="text-muted-soft mb-4">Últimos eventos del juego · cronología</p>
  <div id="eventList" class="d-grid gap-3"></div>
</main>

<footer class="py-4 mt-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>SEKAI Board · Práctica 6 — Programación Web I</span>
    <span>Assets: Project Sekai (fan project)</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sekai.js"></script>
<script>
function renderPage(D) {
  document.getElementById("eventList").innerHTML = D.events.map((e, i) => `
    <div class="card rounded-xxl overflow-hidden">
      <div class="row g-0">
        <div class="col-md-5">
          <div class="position-relative h-100" style="min-height:160px">
            <img src="${e.banner}" alt="${esc(e.name)}" class="img-card position-absolute w-100 h-100" style="inset:0">
            ${i === 0 ? `<span class="badge-event" style="position:absolute">EVENTO EN CURSO</span>` : ""}
          </div>
        </div>
        <div class="col-md-7">
          <div class="card-body p-4 d-flex flex-column h-100">
            <h2 class="h5 fw-bold mb-2">${esc(e.name)}</h2>
            <div class="text-muted-soft small mb-2">
              <i class="bi bi-calendar3 me-1"></i>${fmtDate(e.start)} — ${fmtDate(e.end)}
            </div>
            <div class="d-flex gap-2 mt-auto">
              <a href="booru.html?q=event" class="btn btn-accent btn-sm">Imágenes del evento</a>
              <a href="booru.html" class="btn btn-soft btn-sm">Booru</a>
            </div>
          </div>
        </div>
      </div>
    </div>`).join("");
}
</script>
</body>
</html>
