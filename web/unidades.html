<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEKAI Board · Unidades</title>
<script>
(()=>{const t=localStorage.getItem('sekai-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-bs-theme',t)})()
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="css/sekai.css" rel="stylesheet">
</head>
<body data-page="unidades">

<nav class="navbar navbar-expand-lg navbar-sekai fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span class="brand-sekai">SEKAI</span> Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" data-nav="inicio" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="unidades" href="unidades.html">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="personajes" href="personajes.html">Personajes</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="eventos" href="eventos.html">Eventos</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="booru" href="booru.html">Booru</a></li>
      </ul>
      <button id="themeToggle" class="btn btn-soft ms-lg-2" aria-label="Cambiar tema">☀️</button>
    </div>
  </div>
</nav>

<main class="container pb-5 pt-3">
  <h1 class="fw-bold mb-1">Información · Unidades</h1>
  <p class="text-muted-soft mb-4">Cada banda con sus miembros y logo oficial</p>
  <div id="unitCards" class="row g-4"></div>
</main>

<footer class="py-4 mt-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>SEKAI Board · Práctica 6 — Programación Web I</span>
    <span>Assets: Project Sekai (fan project)</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sekai.js"></script>
<script>
function renderPage(D) {
  document.getElementById("unitCards").innerHTML = D.units.map(u => {
    const members = D.characters.filter(c => c.unit === u.id);
    return `
    <div class="col-md-6 col-xl-4">
      <div class="card rounded-xxl h-100">
        <div class="card-body p-4">
          <div class="unit-logo-plate mb-3"><img src="${u.logo}" alt="${esc(u.name)}"></div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="attr-dot" style="background:${u.color}"></span>
            <h2 class="h5 fw-bold mb-0">${esc(u.name)}</h2>
          </div>
          <small class="text-muted-soft text-uppercase fw-semibold">${esc(u.tag)} · ${members.length} miembros</small>
          <div class="d-flex flex-wrap gap-2 mt-3">
            ${members.map(c => `
              <a href="personajes.html#${c.id}" class="btn btn-soft btn-sm rounded-circle p-0 d-inline-flex align-items-center justify-content-center"
                 style="width:44px;height:44px;border-color:${u.color}" title="${esc(c.name)}">
                <img src="${c.portrait}" alt="${esc(c.first)}" style="width:38px;height:38px;object-fit:contain">
              </a>`).join("")}
          </div>
          <a href="personajes.html#${members[0]?.id ?? 1}" class="btn btn-accent btn-sm mt-3">Ver personajes</a>
        </div>
      </div>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
